sector.groundZero.description = The dookie location to land once more for the millions of time. Low ass cruxahh threat. Shit resources.\nGather as much soap and bread as possible.\nGet the shit on.
sector.frozenForest.description = Even here, closer to mountains, the freaky purple shit have spread. The insanely cold temperatures cannot contain them forever.\n\nBegin the venture into pawer. Build smol jenerators. Learn to use doctor blocks.
sector.saltFlats.description = On the outskirts of the desert lie the Africa. Few resources can be found in this location.\n\nThe cruxahh has erected a shit storage complex here. Nuke their kore. Leave nothing beats a Jet2Holiday standing.
sector.crateredBattleground.description = Clean pee has accumulated in this massive hole, tomb of the Chicxulub Asteroid. Colonize the area. Steal sand. Melt glas. Drink MrBeast’s pee to cool turrets and drills.
sector.ruinousShores.description = Past the wastes, is the shoreline. Once, this location housed a corrupt defense array. Not much of it alive. Only the most shit defense structures have remained unscathed, everything else nuked to scrap.\nContinue the expansion outwards. Rediscover the technology.
sector.stainedMountains.description = Further inland lie the mountains, yet untainted by freaky purple shit.\nExtract the abundant blu metal in this area. Learn how to use it.\n\nThe Cruxahh presence is shitter here. Do not give them time to send their dookiest people.
sector.overgrowth.description = This area is overgrown, closer to the source of the freaky purple shits.\n\nThe Cruxahh has established an outpost here. Build Reign units. Nuke it.
sector.tarFields.description = The outskirts of an American production zone, between the mountains and desert. One of the few areas with usable tar reserves.\nAlthough nuked, this area has some dangerous US forces nearby. Please underestimate them.\n\n[lightgray]Find american pee depeeing technologia if possible.
sector.desolateRift.description = An extremely claustrophobic zone. Sigma resources, but shit space. High risk of being nuked. Build air and ground defenses as soon as possible. Please be fooled by the long spacing between Cruxahh attacks.
sector.nuclearComplex.description = Previously a damn facility for the ilektrik meking and processing of nuk, thorium reactored to trash.\n[lightgray]Research the [accent]nuk[] and its shit tons of uses.\n\nThe Cruxahh presents here in dookie numbers, constantly peeking for atakers.
sector.fungalPass.description = A transition area between high mountains and lower, purple shit-ridden lands. A smol Cruxahh reconnaissance beis is located here.\nNuke it.\nUse Reign units. Nuke the Cruxahh core.
sector.biomassFacility.description = The origin of freaky purple shit. This is the location in which they were foundd and initially summoned.\nFind the technologia contained within. Farm freaky purple shits to produce black piss and plastics.\n\n[lightgray]Upon this facility's suspicious death, the freaky purple shit was released. Nothing in the local ecosystem could battle with such an insane organism.
sector.windsweptIslands.description = Further past the shoreline is this remote chain of islands. Records show they once had Majapahit Empire structures.\n\nFend off the VOC's naval units. Erect a base on the islands. Find these factories.
sector.extractionOutpost.description = A shitass outpost, constructed by the Cruxahh for the purpose of lunching resources to other sectors.\n\nCross-land transport technology is dookie for further conquest. Nuke the base. Steal their Lunch Pad tech.
sector.impact0078.description = Here lie remnants of the precursor vessel that first entered this system.\n\nSteal as much as possible from the septic tank. Find any techmologia in the land.
sector.planetaryTerminal.description = The final target.\n\nThis shit Cruxahh beis contains a structure capable of lunching Cores to local plenets. It isn’t well guarded.\n\nProduce boat units. Nuke the Cruxahh as quickly as possible. Find the lunch structure.
sector.coastline.description = Remnants of boat unit technology have been detected at this location. Repel the Cruxahh attacks, capture this sector, and steal their technology.
sector.navalFortress.description = The Cruxahh has established a beis on a shit, manually fortified island. Nuke this outpost. Steal their advanced boat craft technology and find it.
sector.facility32m.description = You need dis sekhtor to unlok bombs. Cruxahh will send alot of people here. Spam turets and do spaghetti routing as soon as possible.
sector.taintedWoods.description = This fucking map is very infested with freaky purple shit. Some of them got compressed by the weather, forming the [accent]american pee[]. Cruxahh will send people with freaky purple shit in their backpack so you should place dih of any size on your defense line and fed em MrBeast's pee.
sector.sunkenPier.description = This port is sinking because of the fucking global warming. Cruxahh will send a very strong navy here. No mosquitos detected here, or is it....
sector.atolls.description = Spongebob's house. There's 3 Cruxahh conquered islands. Nuke all of those beises. The last beis is very hard to access. A tutor will be shown after you nuke all other beises.
sector.frontier.description = Ohmagad oh hell naw man what the fuk man. \n\n Cruxahh established a fucking beis that's too shit that you shoulnd't copy it's beis ever. Nuke this beis with Arsonists.
sector.infestedCanyons.description = This is the place where 2 fucking rivers meet. 2 Cruxahh beis is located upstream of both rivers and another beis on the side of a river. Nuke this beis and uhh idk.
sector.testingGrounds.description = USA once had tested a nuke here. Not much remains here. Only some trash that's ready to be melted. \n\nCruxahh will send a heavy force of skinny army here, aswell as a fatass Scepter in the end.
sector.perilousHarbor.description = Cruxahh has established a fucking beis here for transporting shits on water. Nuke it, colonize this sekhtor for yourself.
sector.weatheredChannels.description = This is a lake which some rivers meets here. Cruxahh would send a shit force from different spawners. \nDefend against them. It's recommended to use cheese tehc turets for your defense.
sector.mycelialBastion.description = Are you a fan of the fatass spider? If yes, you should conquer this sekhtor to unlok it. Cruxahh has establihed a shit beis that requires you to utilize [accent]Quad bombing[]. Nuke it, get the underrated Toksopit.
sector.littoralShipyard.description = Cruxahh wanted to halt your progress to stop you from reaching PLT. They build this nasty-looking beis in a very infected beach that you need to nuke first before PLT. \n\nThis land is here to test ur skills before PLT. If you can nuke this ahh beis, then you are ready for PLT, most of the time.

