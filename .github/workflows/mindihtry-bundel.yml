name: Monitor External File

on:
  schedule:
    # Berjalan otomatis setiap 6 jam. Anda bisa menyesuaikan jadwal cron ini.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan workflow ini secara manual kapan saja

jobs:
  check-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Fetch external file metadata
        id: fetch_file
        run: |
          # Mengambil metadata file dari GitHub API untuk memeriksa SHA/hash terbaru
          RESPONSE=$(curl -s https://github.com)
          CURRENT_SHA=$(echo "$RESPONSE" | jq -r '.sha')
          
          echo "SHA Terbaru: $CURRENT_SHA"
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT

      - name: Read previous SHA
        id: read_sha
        run: |
          # Membaca SHA yang disimpan dari proses sebelumnya (jika ada)
          if [ -f .github/last_sha.txt ]; then
            PREVIOUS_SHA=$(cat .github/last_sha.txt)
          else
            PREVIOUS_SHA=""
          fi
          echo "SHA Sebelumnya: $PREVIOUS_SHA"
          echo "previous_sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT

      - name: Compare SHA and Update
        if: steps:fetch_file.outputs.current_sha != steps:read_sha.outputs.previous_sha
        run: |
          # Jika SHA berubah, simpan SHA baru ke dalam repositori
          mkdir -p .github
          echo "${{ steps.fetch_file.outputs.current_sha }}" > .github/last_sha.txt
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .github/last_sha.txt
          git commit -m "Chore: Update monitored file SHA [skip ci]"
          git push

      - name: Send Discord Notification
        if: steps:fetch_file.outputs.current_sha != steps:read_sha.outputs.previous_sha && steps:read_sha.outputs.previous_sha != ''
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: Bundel propertis got updated, <@1393198962101456949>.
