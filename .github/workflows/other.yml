name: Notify Discord on New Star

on:
  watch:
    types: [started]

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Message
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "Cursed Bundles"  # Write your custom name here
          content: |
            USERNAME="${{ github.event.sender.login }}"
            REPO="cursed-bundles"
            URL="https://github.com/Wantechfan/mindustry-cursed-bundles"
          
            # Construct JSON payload for Discord
            PAYLOAD=$(cat <<EOF
            {
              "embeds": [{
                "title": "Someone Starred A Repo!",
                "description": "**$USERNAME** just starred [$REPO]($URL)!",
                "color": 16776960
              }]
            }
            EOF
            )
            
            # Send the POST request to Discord
            curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" $DISCORD_WEBHOOK
